name: ESP-IDF Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  extract-config:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.extract.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            source/CMakePresets.json
          sparse-checkout-cone-mode: false

      - name: Extract preset names
        id: extract
        run: |
          platforms=$(jq -c '[.configurePresets[] | {platform: .name, target: (if .name == "JC4880P4" then "esp32p4" else "esp32s3" end)}]' source/CMakePresets.json)
          echo "platforms=$platforms" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: extract-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.extract-config.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          sparse-checkout: |
            source/

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ matrix.platform }}
          evict-old-files: 'job'

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          path: 'source'
          esp_idf_version: v6.0.2
          target: ${{ matrix.target }}
          extra_docker_args: >-
            -v ./.ccache:/root/.ccache
            -e CCACHE_DIR=/root/.ccache
            -e IDF_PRESET=${{ matrix.platform }}
          command: "idf.py build"

      # Each preset has its own binaryDir (e.g. build_ws169)
      - name: Show build output
        run: |
          echo "Looking for build_* directories:"
          ls -d source/build_* 2>/dev/null || true
          find source -name '*.bin' 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            source/build_*/**/*.bin
            source/build_*/flasher_args.json
          if-no-files-found: error